[project]
name = "telegram-screenshot-bot"
version = "0.1.0"
description = "Telegram bot OCR screenshot data entry automation for incentive traffic publishers"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13,<4",
    "pydantic-settings>=2.5,<3",
    "aiosqlite>=0.20",
    "google-cloud-vision>=3.7",
    "gspread>=6.1",
    "google-auth>=2.34",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app", "app.handlers", "app.services", "app.models", "app.utils"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
